name: ci

# Build + test on the three supported platforms. Catches MSVC / libstdc++ /
# libc++ / Apple-Clang differences that local Windows-only dev cannot see.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.label || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
          # Older-toolchain canary: GCC 10 lacks std::from_chars<double>,
          # so this row verifies the fast_float polyfill keeps working.
          # Also exercises Ubuntu 22.04 (CMake 3.22, libstdc++ 12 backport).
          - os: ubuntu-22.04
            cc: gcc-10
            cxx: g++-10
            label: ubuntu-22.04 / gcc-10

    runs-on: ${{ matrix.os }}

    env:
      CC:  ${{ matrix.cc  || '' }}
      CXX: ${{ matrix.cxx || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The older-toolchain canary needs g++-10 installed; runners default
      # to the distro's current default (g++-11 on ubuntu-22.04).
      - name: Install older GCC
        if: matrix.cxx == 'g++-10'
        run: sudo apt-get update && sudo apt-get install -y g++-10

      # Cache the FetchContent deps (Catch2 + manifold + miniz + fast_float).
      # Key on the CMakeLists so any dep-version bump invalidates. The label
      # is included so the older-GCC row gets its own cache (different ABI).
      - name: Cache _deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-${{ matrix.label || 'default' }}-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.label || 'default' }}-deps-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # ctest discovers the Catch2 test cases (via catch_discover_tests in
      # tests/CMakeLists.txt). --output-on-failure prints details only when
      # a case fails. -C selects the multi-config (Windows VS) configuration.
      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

      # On failure, upload the CLI + test binaries + CMakeFiles logs so we
      # can debug without re-running CI locally.
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            build/cli/**/meshseal_cli*
            build/tests/**/tests_meshseal*
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
